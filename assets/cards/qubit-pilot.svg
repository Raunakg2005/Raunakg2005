<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="qubit-pilot — TypeScript project">
  <title>qubit-pilot</title>
  <defs>
    <linearGradient id="bg-qubit-pilot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="top-qubit-pilot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#3178C6" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-qubit-pilot { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-qubit-pilot { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#3178C6; letter-spacing:0.6px; }
      .d-qubit-pilot { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#8B949E; }
      .c-qubit-pilot { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#3178C6; }
      .s-qubit-pilot { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#F0A868; }
      .l-qubit-pilot { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#7EE7C7; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-qubit-pilot)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#30363D" stroke-width="2"/>
  <path d="M14 1h396a13 13 0 0 1 13 13v2H1v-2a13 13 0 0 1 13-13z" fill="url(#top-qubit-pilot)"/>

  <text x="26" y="46" class="t-qubit-pilot">qubit-pilot</text>
  <circle cx="31" cy="66" r="5" fill="#3178C6"/>
  <text x="43" y="70" class="g-qubit-pilot">TypeScript</text>


    <text x="26" y="112" class="d-qubit-pilot">A quantum circuit workbench — build, run and visualise</text>
    <text x="26" y="130" class="d-qubit-pilot">circuits straight from the browser.</text>

    <rect x="26" y="166" width="73" height="22" rx="11" fill="#3178C6" fill-opacity="0.12" stroke="#3178C6" stroke-opacity="0.45"/>
    <text x="62" y="181" class="c-qubit-pilot" text-anchor="middle">Circuits</text>
    <rect x="106.8" y="166" width="86" height="22" rx="11" fill="#3178C6" fill-opacity="0.12" stroke="#3178C6" stroke-opacity="0.45"/>
    <text x="150" y="181" class="c-qubit-pilot" text-anchor="middle">Visualiser</text>
  <circle cx="394" cy="177" r="4" fill="#7EE7C7">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="384" y="181" class="l-qubit-pilot" text-anchor="end">LIVE</text>
</svg>
