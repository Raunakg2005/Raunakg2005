      .l-VR_Shooting_Gallery { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#7EE7C7; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-VR_Shooting_Gallery)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
