  <title>VR Shooting Gallery</title>
  <defs>
    <linearGradient id="bg-VR_Shooting_Gallery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="top-VR_Shooting_Gallery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#178600"/>
      <stop offset="100%" stop-color="#178600" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-VR_Shooting_Gallery { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
