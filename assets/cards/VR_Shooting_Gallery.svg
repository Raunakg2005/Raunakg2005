  <path d="M14 1h396a13 13 0 0 1 13 13v2H1v-2a13 13 0 0 1 13-13z" fill="url(#top-VR_Shooting_Gallery)"/>

  <text x="26" y="46" class="t-VR_Shooting_Gallery">VR Shooting Gallery</text>
