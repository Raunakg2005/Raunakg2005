  <title>ResoRoute</title>
  <defs>
    <linearGradient id="bg-ResoRoute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="top-ResoRoute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4AB"/>
      <stop offset="100%" stop-color="#00B4AB" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-ResoRoute { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
