    <rect x="100.19999999999999" y="166" width="60" height="22" rx="11" fill="#00B4AB" fill-opacity="0.12" stroke="#00B4AB" stroke-opacity="0.45"/>
    <text x="130" y="181" class="c-ResoRoute" text-anchor="middle">Mobile</text>
  <circle cx="394" cy="177" r="4" fill="#7EE7C7">
