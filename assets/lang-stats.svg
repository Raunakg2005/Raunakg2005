    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.43s" fill="freeze"/>
      <circle cx="277" cy="146" r="5.5" fill="#178600"/>
      <text x="290" y="150" class="lg">C#</text>
