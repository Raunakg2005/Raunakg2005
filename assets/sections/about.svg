<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="About Me">
  <title>About Me</title>
  <defs>
    <linearGradient id="bg-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B191FF" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B191FF"/>
      <stop offset="60%"  stop-color="#B191FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B191FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-about" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#B191FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B191FF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-about" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-about { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-about { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#B191FF;
                   fill-opacity:0.75; letter-spacing:2px; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="78" rx="12" fill="url(#bg-about)"/>

  <!-- accent badge + vector glyph -->
  <rect x="14" y="19" width="40" height="40" rx="11" fill="url(#badge-about)"
        stroke="#B191FF" stroke-opacity="0.45"/>
  <g transform="translate(22 27) scale(1.12)" color="#B191FF" opacity="0.95">
    <g><circle cx="12" cy="8.5" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.2 20.5c0-4.3 3.5-6.6 7.8-6.6s7.8 2.3 7.8 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
  </g>

  <text x="70" y="36" class="t-about">About Me</text>
  <text x="71" y="55" class="k-about">WHO I AM AND WHAT I BUILD</text>

  <!-- trailing rule with a travelling highlight -->
  <rect x="70" y="66" width="752" height="2" rx="1" fill="url(#rule-about)" opacity="0.5"/>
  <rect y="66" width="90" height="2" rx="1" fill="#B191FF" filter="url(#soft-about)">
    <animate attributeName="x" values="70;670;70" dur="7s"
             keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.75;0.15" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
