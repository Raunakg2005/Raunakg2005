<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="App Development · AR / VR">
  <title>App Development · AR / VR</title>
  <defs>
    <linearGradient id="bg-apps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7EE7C7" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-apps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7EE7C7"/>
      <stop offset="60%"  stop-color="#7EE7C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7EE7C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-apps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7EE7C7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7EE7C7" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-apps" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-apps { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-apps { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#7EE7C7;
                   fill-opacity:0.75; letter-spacing:2px; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="78" rx="12" fill="url(#bg-apps)"/>

  <!-- accent badge + vector glyph -->
  <rect x="14" y="19" width="40" height="40" rx="11" fill="url(#badge-apps)"
        stroke="#7EE7C7" stroke-opacity="0.45"/>
  <g transform="translate(22 27) scale(1.12)" color="#7EE7C7" opacity="0.95">
    <g><rect x="3" y="2.6" width="11" height="18.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="6.6" y1="18.4" x2="10.4" y2="18.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.4 8.6h3.4a2 2 0 0 1 2 2v3.6a2 2 0 0 1-2 2h-1l-1.4 2-1.4-2h-.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></g>
  </g>

  <text x="70" y="36" class="t-apps">App Development · AR / VR</text>
  <text x="71" y="55" class="k-apps">NATIVE, CROSS-PLATFORM, IMMERSIVE</text>

  <!-- trailing rule with a travelling highlight -->
  <rect x="70" y="66" width="752" height="2" rx="1" fill="url(#rule-apps)" opacity="0.5"/>
  <rect y="66" width="90" height="2" rx="1" fill="#7EE7C7" filter="url(#soft-apps)">
    <animate attributeName="x" values="70;670;70" dur="7s"
             keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.75;0.15" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
